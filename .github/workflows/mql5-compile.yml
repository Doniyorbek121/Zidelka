name: MQL5 Compile (MetaEditor) — best-effort

# MetaTrader 5 ni Windows runnerga o'rnatib, metaeditor64.exe orqali
# HAQIQIY kompilyatsiya qilishga urinadi.
#
# MUHIM: GitHub-hosted runnerda sokin o'rnatilgan MetaEditor headless
# rejimda ishonchli kompilyatsiya QILMAYDI (odatda oldindan faollashtirilgan
# terminal/hisob talab qiladi) — u ko'pincha .ex5/log yaratmaydi. Shu sababli
# bu workflow "best-effort" bo'lib, FAQAT qo'lda ishga tushiriladi
# (workflow_dispatch) va natijasi umumiy holatni BLOKLAMAYDI.
#
# Asosiy, ishonchli tekshiruv — mql5-validate.yml (Linux struktura) hamda
# yakuniy MetaEditor F7 kompilyatsiyasi (mahalliy).

on:
  workflow_dispatch:

jobs:
  compile:
    name: Compile with MetaEditor (best-effort)
    runs-on: windows-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download & install MetaTrader 5
        shell: pwsh
        run: |
          $url = "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe"
          $ok = $false
          for ($i = 1; $i -le 3; $i++) {
            try {
              Write-Host "MT5 setup yuklab olinmoqda (urinish $i)..."
              Invoke-WebRequest -Uri $url -OutFile "mt5setup.exe" -UseBasicParsing
              $ok = $true; break
            } catch {
              Write-Host "Yuklash xatosi: $_"; Start-Sleep -Seconds 10
            }
          }
          if (-not $ok) { Write-Error "MT5 setup yuklab bo'lmadi"; exit 1 }

          Write-Host "MT5 sokin o'rnatilmoqda..."
          Start-Process -FilePath ".\mt5setup.exe" -ArgumentList "/auto" | Out-Null

          # To'liq o'rnatishni kutamiz: ham metaeditor64.exe, ham standart
          # Include (Trade/Trade.mqh) paydo bo'lguncha.
          $editor = "C:\Program Files\MetaTrader 5\metaeditor64.exe"
          $inc    = "C:\Program Files\MetaTrader 5\MQL5\Include\Trade\Trade.mqh"
          $elapsed = 0
          while ((-not (Test-Path $editor) -or -not (Test-Path $inc)) -and $elapsed -lt 480) {
            Start-Sleep -Seconds 10; $elapsed += 10
          }
          if (-not (Test-Path $editor)) {
            Write-Error "MetaEditor topilmadi — o'rnatish vaqti tugadi"; exit 1
          }
          if (-not (Test-Path $inc)) {
            Write-Host "::warning::Standart Include topilmadi — kompilyatsiya xato berishi mumkin"
          }
          # o'rnatuvchi tugashi uchun biroz kutamiz, terminal/metaeditorni yopamiz
          Start-Sleep -Seconds 20
          Get-Process terminal64,metaeditor64 -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Write-Host "MetaEditor tayyor: $editor"

      - name: Compile sources
        shell: pwsh
        run: |
          $editor = "C:\Program Files\MetaTrader 5\metaeditor64.exe"
          $mql5   = "C:\Program Files\MetaTrader 5\MQL5"

          # repo fayllarini MT5 MQL5 daraxtiga nusxalaymiz (standart
          # #include <Trade/...> lar shu yerdan avtomatik topiladi)
          New-Item -ItemType Directory -Force -Path "$mql5\Indicators\Zidelka" | Out-Null
          New-Item -ItemType Directory -Force -Path "$mql5\Experts\Zidelka"    | Out-Null
          Copy-Item -Recurse -Force "MQL5\Indicators\Zidelka\*" "$mql5\Indicators\Zidelka\"
          Copy-Item -Recurse -Force "MQL5\Experts\Zidelka\*"    "$mql5\Experts\Zidelka\"

          $files = @(
            "$mql5\Indicators\Zidelka\ZidelkaProSignal.mq5",
            "$mql5\Indicators\Zidelka\ZidelkaProPressure.mq5",
            "$mql5\Experts\Zidelka\ZidelkaProEA.mq5"
          )

          $failed = $false
          foreach ($f in $files) {
            $log = "$f.log"
            $ex5 = [System.IO.Path]::ChangeExtension($f, ".ex5")
            if (Test-Path $log) { Remove-Item $log -Force }
            if (Test-Path $ex5) { Remove-Item $ex5 -Force }

            Write-Host "==================================================="
            Write-Host "Kompilyatsiya: $f"

            # MUHIM: metaeditor64.exe — bitta-nusxali (single-instance) ilova.
            # Agar nusxa allaqachon ishlab tursa, /compile chaqiruvi unga
            # uzatilib darrov chiqadi va aslida kompilyatsiya qilmaydi. Shuning
            # uchun har safar avval mavjud nusxani yopamiz.
            Get-Process metaeditor64 -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 2

            # ProcessStartInfo.ArgumentList bo'shliqli yo'llarni to'g'ri uzatadi.
            $psi = New-Object System.Diagnostics.ProcessStartInfo
            $psi.FileName = $editor
            [void]$psi.ArgumentList.Add("/compile:$f")
            [void]$psi.ArgumentList.Add("/inc:$mql5")
            [void]$psi.ArgumentList.Add("/log:$log")
            $psi.UseShellExecute = $false
            $proc = [System.Diagnostics.Process]::Start($psi)

            # Kompilyatsiya asinxron/GUI-instansiyada bo'lishi mumkin, shuning
            # uchun jarayonni uzoq bloklamasdan .ex5 paydo bo'lguncha kutamiz.
            $w = 0
            while (-not (Test-Path $ex5) -and $w -lt 90) {
              Start-Sleep -Seconds 3; $w += 3
            }
            Start-Sleep -Seconds 2

            # keyingi fayl uchun toza holat — bu metaeditor nusxasini yopamiz
            Get-Process metaeditor64 -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

            if (Test-Path $log) {
              Get-Content $log -Encoding Unicode | ForEach-Object { Write-Host $_ }
            }

            if (Test-Path $ex5) {
              Write-Host "OK: $([System.IO.Path]::GetFileName($ex5)) yaratildi"
            } else {
              $detail = (Test-Path $log) ? "log bor, lekin .ex5 yaratilmadi (xato bo'lishi mumkin)" : "na .ex5, na log yaratildi"
              Write-Host "::error file=$f::Kompilyatsiya muvaffaqiyatsiz — $detail"
              $failed = $true
            }
          }

          if ($failed) {
            Write-Error "Bir yoki bir nechta fayl kompilyatsiyadan o'tmadi"
            exit 1
          }
          Write-Host "Barcha fayllar muvaffaqiyatli kompilyatsiya qilindi."

      - name: Upload compiled binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mql5-binaries
          path: |
            C:\Program Files\MetaTrader 5\MQL5\Indicators\Zidelka\*.ex5
            C:\Program Files\MetaTrader 5\MQL5\Experts\Zidelka\*.ex5
          if-no-files-found: ignore
